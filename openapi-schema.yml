      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/projects/{project_id}/reports/assignee-workload/:
    get:
      operationId: project_report_assignee_workload
      description: 'Issue counts per assignee, busiest first. Only `assignee_id`,
        `username` and `full_name` are exposed for each user. Issues with no assignee
        form one group with `assignee_id` null, listed last and present only when
        such issues exist. Counts non-archived issues of the project. Available to
        any member of a non-archived project (viewers included). Responds 401 when
        the request is not authenticated and 404 with code `not_found` when the project
        does not exist, is archived, or the caller is not a member (the cases are
        deliberately indistinguishable). Read-only: no activity is recorded.'
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssigneeWorkload'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportError'
          description: ''
  /api/v1/projects/{project_id}/reports/overview/:
    get:
      operationId: project_report_overview
      description: 'Progress metrics for one project. `open_issues` counts TODO, `in_progress_issues`
        counts IN_PROGRESS and IN_REVIEW, and `completed_issues` counts DONE. Overdue
        means not DONE with a due date before today (server timezone). Counts non-archived
        issues of the project. Available to any member of a non-archived project (viewers
        included). Responds 401 when the request is not authenticated and 404 with
        code `not_found` when the project does not exist, is archived, or the caller
        is not a member (the cases are deliberately indistinguishable). Read-only:
        no activity is recorded.'
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOverview'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportError'
          description: ''
  /api/v1/projects/{project_id}/reports/priority-distribution/:
    get:
      operationId: project_report_priority_distribution
      description: 'Issue count per priority, from lowest to highest priority. Every
        declared priority is present, with 0 when unused; `other_count` holds any
        undeclared legacy value. Counts non-archived issues of the project. Available
        to any member of a non-archived project (viewers included). Responds 401 when
        the request is not authenticated and 404 with code `not_found` when the project
        does not exist, is archived, or the caller is not a member (the cases are
        deliberately indistinguishable). Read-only: no activity is recorded.'
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriorityDistribution'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportError'
          description: ''
  /api/v1/projects/{project_id}/reports/status-distribution/:
    get:
      operationId: project_report_status_distribution
      description: 'Issue count per status, in the order of the status choices. Every
        declared status is present, with 0 when unused; `other_count` holds any undeclared
        legacy value. Counts non-archived issues of the project. Available to any
        member of a non-archived project (viewers included). Responds 401 when the
        request is not authenticated and 404 with code `not_found` when the project
        does not exist, is archived, or the caller is not a member (the cases are
        deliberately indistinguishable). Read-only: no activity is recorded.'
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusDistribution'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportError'
          description: ''
  /api/v1/projects/{project_id}/reports/trends/:
    get:
      operationId: project_report_trends
      description: 'Issues created and completed per day or week. Dates are inclusive
        calendar dates in the server timezone. `created_count` uses the issue creation
        time; `completed_count` counts the recorded transitions to DONE (never `updated_at`).
        Every period in the range is present, with zeros when empty; weeks start on
        Monday and are labelled by that Monday. An invalid or missing parameter returns
        400 with code `bad_request`. Counts non-archived issues of the project. Available
        to any member of a non-archived project (viewers included). Responds 401 when
        the request is not authenticated and 404 with code `not_found` when the project
        does not exist, is archived, or the caller is not a member (the cases are
        deliberately indistinguishable). Read-only: no activity is recorded.'
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
        description: First day, `YYYY-MM-DD`, inclusive. Between 1970-01-01 and 2100-12-31.
        required: true
      - in: query
        name: date_to
        schema:
          type: string
        description: Last day, `YYYY-MM-DD`, inclusive. Must not be before `date_from`;
          the range is at most 366 days. Between 1970-01-01 and 2100-12-31.
        required: true
      - in: query
        name: interval
        schema:
          type: string
          enum:
          - day
          - week
          default: day
        description: Size of each period.
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trends'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportError'
          description: ''
components:
  schemas:
    ActionEnum:
      enum:
      - PROJECT_CREATED
      - PROJECT_UPDATED
      - PROJECT_ARCHIVED
      - MEMBER_ADDED
      - MEMBER_REMOVED
      - ROLE_CHANGED
      - ISSUE_CREATED
      - ISSUE_UPDATED
      - ISSUE_ASSIGNED
      - ISSUE_UNASSIGNED
      - ISSUE_STATUS_CHANGED
      - ISSUE_ARCHIVED
      type: string
      description: |-
        * `PROJECT_CREATED` - Project created
        * `PROJECT_UPDATED` - Project updated
        * `PROJECT_ARCHIVED` - Project archived
        * `MEMBER_ADDED` - Member added
        * `MEMBER_REMOVED` - Member removed
        * `ROLE_CHANGED` - Role changed
        * `ISSUE_CREATED` - Issue created
        * `ISSUE_UPDATED` - Issue updated
        * `ISSUE_ASSIGNED` - Issue assigned
        * `ISSUE_UNASSIGNED` - Issue unassigned
        * `ISSUE_STATUS_CHANGED` - Issue status changed
        * `ISSUE_ARCHIVED` - Issue archived
    Activity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: object
          properties:
            id:
              type: integer
            username:
              type: string
          required:
          - id
          - username
          readOnly: true
        action:
          $ref: '#/components/schemas/ActionEnum'
        entity_type:
          $ref: '#/components/schemas/EntityTypeEnum'
        entity_id:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        description:
          type: string
        metadata: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - created_at
      - description
      - entity_id
      - entity_type
      - id
      - user
    AddProjectMember:
      type: object
      properties:
        user_id:
          type: integer
        role:
          allOf:
          - $ref: '#/components/schemas/ProjectRoleEnum'
          default: TEAM_MEMBER
      required:
      - user_id
    AssigneeWorkload:
      type: object
      properties:
        project_id:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/AssigneeWorkloadItem'
        total_issues:
          type: integer
          description: Sum of `assigned_issues` over all groups.
      required:
      - project_id
      - results
      - total_issues
    AssigneeWorkloadItem:
      type: object
      properties:
        assignee_id:
          type: integer
          nullable: true
          description: '`null` for the group of unassigned issues.'
        username:
          type: string
          nullable: true
        full_name:
          type: string
          nullable: true
        assigned_issues:
          type: integer
        open_issues:
          type: integer
        in_progress_issues:
          type: integer
        completed_issues:
          type: integer
        overdue_issues:
          type: integer
      required:
      - assigned_issues
      - assignee_id
      - completed_issues
      - full_name
      - in_progress_issues
      - open_issues
      - overdue_issues
      - username
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
          minLength: 8
        new_password_confirm:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - current_password
      - new_password
      - new_password_confirm
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        issue:
          type: integer
          readOnly: true
        author:
          type: object
          properties:
            id:
              type: integer
            username:
              type: string
          required:
          - id
          - username
          readOnly: true
        body:
          type: string
          nullable: true
          readOnly: true
        mentions:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              username:
                type: string
            required:
            - id
            - username
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        edited_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_deleted:
          type: boolean
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - author
      - body
      - created_at
      - deleted_at
      - edited_at
      - id
      - is_deleted
      - issue
      - mentions
      - updated_at
    CommentInput:
      type: object
      description: |-
        Only the text can be written. The author is always the request user
        and the issue comes from the URL, so neither is accepted from the client.
      properties:
        body:
          type: string
          maxLength: 5000
      required:
      - body
    Dashboard:
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/DashboardSummary'
        issues_by_status:
          $ref: '#/components/schemas/IssuesByStatus'
        recent_issues:
          type: array
          items:
            $ref: '#/components/schemas/DashboardIssue'
      required:
      - issues_by_status
      - recent_issues
      - summary
    DashboardIssue:
      type: object
      description: The few issue fields a dashboard row needs.
      properties:
        id:
          type: integer
          readOnly: true
        issue_key:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          readOnly: true
        project_id:
          type: integer
          readOnly: true
        due_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - due_date
      - id
      - issue_key
      - priority
      - project_id
      - status
      - title
      - updated_at
    DashboardSummary:
      type: object
      properties:
        projects_count:
          type: integer
          description: Non-archived projects the user is a member of.
        assigned_issues_count:
          type: integer
          description: Non-archived issues assigned to the user in projects they can
            access. Normally equals the sum of issues_by_status; it also counts any
            issue whose status is not one of the declared choices.
        in_progress_count:
          type: integer
          description: Assigned issues with status IN_PROGRESS.
        completed_count:
          type: integer
          description: Assigned issues with status DONE.
        overdue_count:
          type: integer
          description: Assigned, incomplete issues with a due date before today.
      required:
      - assigned_issues_count
      - completed_count
      - in_progress_count
      - overdue_count
      - projects_count
    EntityTypeEnum:
      enum:
      - PROJECT
      - MEMBERSHIP
      - ISSUE
      type: string
      description: |-
        * `PROJECT` - Project
        * `MEMBERSHIP` - Membership
        * `ISSUE` - Issue
    IntervalEnum:
      enum:
      - day
      - week
      type: string
      description: |-
        * `day` - day
        * `week` - week
    Issue:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        issue_key:
          type: string
          readOnly: true
        issue_number:
          type: integer
          readOnly: true
        project:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        issue_type:
          $ref: '#/components/schemas/IssueTypeEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        reporter:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        assignee:
          type: integer
          nullable: true
        reporter_detail:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            username:
              type: string
            full_name:
              type: string
          readOnly: true
        assignee_detail:
