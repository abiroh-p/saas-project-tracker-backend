      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProjectMember'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddProjectMember'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddProjectMember'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMember'
          description: ''
  /api/v1/projects/{project_id}/members/{member_id}/:
    patch:
      operationId: v1_projects_members_partial_update
      parameters:
