    PatchedUpdateProjectMemberRole:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/ProjectRoleEnum'
    PriorityCount:
      type: object
      properties:
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        label:
          type: string
        count:
          type: integer
      required:
      - count
      - label
      - priority
    PriorityDistribution:
      type: object
      properties:
        project_id:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/PriorityCount'
        other_count:
          type: integer
          description: Issues whose priority is not one of the declared choices (legacy
            data). Normally 0.
        total_issues:
          type: integer
          description: Sum of every count in `results` plus `other_count`.
      required:
      - other_count
      - project_id
      - results
      - total_issues
    PriorityEnum:
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - URGENT
      type: string
      description: |-
        * `LOW` - Low
        * `MEDIUM` - Medium
        * `HIGH` - High
        * `URGENT` - Urgent
    Profile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          maxLength: 254
        full_name:
          type: string
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
      required:
      - email
      - full_name
      - id
      - role
      - username
    Project:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        key:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 255
        description:
          type: string
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        created_by:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_archived:
          type: boolean
          readOnly: true
        my_role:
          nullable: true
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/ProjectRoleEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - created_at
      - created_by
      - id
      - is_archived
      - key
      - my_role
      - name
      - updated_at
    ProjectMember:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/ProjectRoleEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - full_name
      - id
      - role
      - user_id
      - username
    ProjectOverview:
      type: object
      properties:
        project_id:
          type: integer
        project_key:
          type: string
        total_issues:
          type: integer
          description: Non-archived issues in the project.
        open_issues:
          type: integer
          description: Issues not started yet (status TODO).
        in_progress_issues:
          type: integer
          description: Issues being worked on (status IN_PROGRESS or IN_REVIEW).
        completed_issues:
          type: integer
          description: Issues with status DONE.
        overdue_issues:
          type: integer
          description: Issues that are not DONE and whose due date is before today.
            An issue due today is not overdue.
        unassigned_issues:
          type: integer
          description: Issues with no assignee.
        completion_rate:
          type: number
          format: double
          description: completed_issues / total_issues * 100, rounded half-up to one
            decimal place; 0.0 when the project has no issues.
      required:
      - completed_issues
      - completion_rate
      - in_progress_issues
      - open_issues
      - overdue_issues
      - project_id
      - project_key
      - total_issues
      - unassigned_issues
    ProjectRoleEnum:
      enum:
      - PROJECT_MANAGER
      - TEAM_MEMBER
      - VIEWER
      type: string
      description: |-
        * `PROJECT_MANAGER` - Project Manager
        * `TEAM_MEMBER` - Team Member
        * `VIEWER` - Viewer
    RegisterResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - message
      - user
    Registration:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 8
        password_confirm:
          type: string
          writeOnly: true
      required:
      - email
      - full_name
      - password
    ReportError:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string
      required:
      - code
      - detail
    StatusCount:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
        label:
          type: string
        count:
          type: integer
      required:
      - count
      - label
      - status
    StatusDistribution:
      type: object
      properties:
        project_id:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/StatusCount'
        other_count:
          type: integer
          description: Issues whose status is not one of the declared choices (legacy
            data). Normally 0.
        total_issues:
          type: integer
          description: Sum of every count in `results` plus `other_count`.
      required:
      - other_count
      - project_id
      - results
      - total_issues
    StatusEnum:
      enum:
      - TODO
      - IN_PROGRESS
      - IN_REVIEW
      - DONE
      type: string
      description: |-
        * `TODO` - To Do
        * `IN_PROGRESS` - In Progress
        * `IN_REVIEW` - In Review
        * `DONE` - Done
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    TrendPoint:
      type: object
      properties:
        period:
          type: string
          format: date
          description: The day, or the Monday that starts the week.
        created_count:
          type: integer
        completed_count:
          type: integer
      required:
      - completed_count
      - created_count
      - period
    Trends:
      type: object
      properties:
        project_id:
          type: integer
        interval:
          $ref: '#/components/schemas/IntervalEnum'
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        results:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'
      required:
      - date_from
      - date_to
      - interval
      - project_id
      - results
    User:
      type: object
      description: The user payload shared by register, login and me.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
      required:
      - email
      - full_name
      - id
      - role
      - username
    UserRoleEnum:
      enum:
      - ADMIN
      - PROJECT_MANAGER
      - TEAM_MEMBER
      type: string
      description: |-
        * `ADMIN` - Administrator
        * `PROJECT_MANAGER` - Project Manager
        * `TEAM_MEMBER` - Team Member
    UserSummary:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        full_name:
          type: string
      required:
      - full_name
      - id
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
