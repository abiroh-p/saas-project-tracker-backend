openapi: 3.0.3
info:
  title: SaaS Project Tracker API
  version: 1.0.0
  description: Backend API for the SaaS Project Tracker.
paths:
  /api/v1/accounts/change-password/:
    post:
      operationId: v1_accounts_change_password_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/accounts/login/:
    post:
      operationId: v1_accounts_login_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/accounts/logout/:
    post:
      operationId: v1_accounts_logout_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/accounts/me/:
    get:
      operationId: v1_accounts_me_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/accounts/profile/:
    get:
      operationId: v1_accounts_profile_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: v1_accounts_profile_partial_update
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/accounts/register/:
    post:
      operationId: v1_accounts_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Registration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Registration'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/accounts/token/refresh/:
    post:
      operationId: v1_accounts_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/accounts/users/:
    get:
      operationId: v1_accounts_users_retrieve
      description: Search active users by username (for member / assignee pickers).
      parameters:
      - in: query
        name: search
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/issues/{issue_id}/:
    get:
      operationId: v1_issues_retrieve
      parameters:
      - in: path
        name: issue_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
    patch:
      operationId: v1_issues_partial_update
      parameters:
      - in: path
        name: issue_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedIssue'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedIssue'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedIssue'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
  /api/v1/issues/{issue_id}/archive/:
    post:
      operationId: v1_issues_archive_create
      parameters:
      - in: path
        name: issue_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
  /api/v1/issues/{issue_id}/transition/:
    post:
      operationId: v1_issues_transition_create
      parameters:
      - in: path
        name: issue_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTransition'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IssueTransition'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IssueTransition'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
  /api/v1/projects/:
    get:
      operationId: projects_list
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProject'
          description: ''
    post:
      operationId: v1_projects_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/v1/projects/{project_id}/:
    get:
      operationId: project_retrieve
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    patch:
      operationId: v1_projects_partial_update
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProject'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProject'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProject'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/v1/projects/{project_id}/archive/:
    post:
      operationId: v1_projects_archive_create
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/projects/{project_id}/issues/:
    get:
      operationId: v1_projects_issues_retrieve
      parameters:
      - in: query
        name: assignee
        schema:
          type: integer
      - in: query
        name: issue_type
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: string
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      - in: query
        name: status
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIssue'
          description: ''
    post:
      operationId: v1_projects_issues_create
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Issue'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Issue'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Issue'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
  /api/v1/projects/{project_id}/members/:
    get:
      operationId: v1_projects_members_list
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMember'
          description: ''
    post:
      operationId: v1_projects_members_create
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProjectMember'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddProjectMember'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddProjectMember'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMember'
          description: ''
  /api/v1/projects/{project_id}/members/{member_id}/:
    patch:
      operationId: v1_projects_members_partial_update
      parameters:
      - in: path
        name: member_id
        schema:
          type: integer
        required: true
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProjectMemberRole'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProjectMemberRole'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProjectMemberRole'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMember'
          description: ''
    delete:
      operationId: v1_projects_members_destroy
      parameters:
      - in: path
        name: member_id
        schema:
          type: integer
        required: true
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    AddProjectMember:
      type: object
      properties:
        user_id:
          type: integer
        role:
          allOf:
          - $ref: '#/components/schemas/ProjectRoleEnum'
          default: TEAM_MEMBER
      required:
      - user_id
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
          minLength: 8
        new_password_confirm:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - current_password
      - new_password
      - new_password_confirm
    Issue:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        issue_key:
          type: string
          readOnly: true
        issue_number:
          type: integer
          readOnly: true
        project:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        issue_type:
          $ref: '#/components/schemas/IssueTypeEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        reporter:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        assignee:
          type: integer
          nullable: true
        reporter_detail:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            username:
              type: string
          readOnly: true
        assignee_detail:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            username:
              type: string
          readOnly: true
        due_date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_archived:
          type: boolean
          readOnly: true
      required:
      - assignee_detail
      - created_at
      - id
      - is_archived
      - issue_key
      - issue_number
      - project
      - reporter
      - reporter_detail
      - status
      - title
      - updated_at
    IssueTransition:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - status
    IssueTypeEnum:
      enum:
      - TASK
      - BUG
      - STORY
      - EPIC
      type: string
      description: |-
        * `TASK` - Task
        * `BUG` - Bug
        * `STORY` - Story
        * `EPIC` - Epic
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    Logout:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    NullEnum:
      enum:
      - null
    PaginatedIssue:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
      required:
      - count
      - next
      - previous
      - results
    PaginatedProject:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Project'
      required:
      - count
      - next
      - previous
      - results
    PatchedIssue:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        issue_key:
          type: string
          readOnly: true
        issue_number:
          type: integer
          readOnly: true
        project:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        issue_type:
          $ref: '#/components/schemas/IssueTypeEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        reporter:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        assignee:
          type: integer
          nullable: true
        reporter_detail:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            username:
              type: string
          readOnly: true
        assignee_detail:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            username:
              type: string
          readOnly: true
        due_date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_archived:
          type: boolean
          readOnly: true
    PatchedProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        role:
          allOf:
          - $ref: '#/components/schemas/ProfileRoleEnum'
          readOnly: true
    PatchedProject:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        key:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 255
        description:
          type: string
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        created_by:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_archived:
          type: boolean
        my_role:
          nullable: true
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/ProjectRoleEnum'
          - $ref: '#/components/schemas/NullEnum'
    PatchedUpdateProjectMemberRole:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/ProjectRoleEnum'
    PriorityEnum:
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - URGENT
      type: string
      description: |-
        * `LOW` - Low
        * `MEDIUM` - Medium
        * `HIGH` - High
        * `URGENT` - Urgent
    Profile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        role:
          allOf:
          - $ref: '#/components/schemas/ProfileRoleEnum'
          readOnly: true
      required:
      - id
      - role
      - username
    ProfileRoleEnum:
      enum:
      - ADMIN
      - PROJECT_MANAGER
      - TEAM_MEMBER
      type: string
      description: |-
        * `ADMIN` - Administrator
        * `PROJECT_MANAGER` - Project Manager
        * `TEAM_MEMBER` - Team Member
    Project:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        key:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 255
        description:
          type: string
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        created_by:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_archived:
          type: boolean
        my_role:
          nullable: true
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/ProjectRoleEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - created_at
      - created_by
      - id
      - key
      - my_role
      - name
      - updated_at
    ProjectMember:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/ProjectRoleEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - role
      - user_id
      - username
    ProjectRoleEnum:
      enum:
      - PROJECT_MANAGER
      - TEAM_MEMBER
      - VIEWER
      type: string
      description: |-
        * `PROJECT_MANAGER` - Project Manager
        * `TEAM_MEMBER` - Team Member
        * `VIEWER` - Viewer
    Registration:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
          minLength: 8
        password_confirm:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - password
      - password_confirm
      - username
    StatusEnum:
      enum:
      - TODO
      - IN_PROGRESS
      - IN_REVIEW
      - DONE
      type: string
      description: |-
        * `TODO` - To Do
        * `IN_PROGRESS` - In Progress
        * `IN_REVIEW` - In Review
        * `DONE` - Done
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
