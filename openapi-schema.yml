      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/accounts/register/:
    post:
      operationId: v1_accounts_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Registration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Registration'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
  /api/v1/accounts/token/refresh/:
    post:
      operationId: v1_accounts_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/accounts/users/:
    get:
      operationId: v1_accounts_users_list
      description: Search active users by name or username (for member / assignee
        pickers).
      parameters:
      - in: query
        name: search
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
          description: ''
  /api/v1/dashboard/:
    get:
      operationId: dashboard_retrieve
      description: |-
        Summary of the authenticated user's projects and assigned work. The owner is always the authenticated user; the endpoint takes no parameters.

        Archived issues, archived projects and projects the user is no longer a member of are excluded everywhere. An issue is overdue when it is not DONE and its due date is before today (server timezone); an issue due today is not overdue. `recent_issues` holds up to 5 of the user's assigned issues, most recently updated first.

        Responds 401 when the request is not authenticated.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
  /api/v1/issues/:
    get:
      operationId: issue_list
      description: Non-archived issues of every non-archived project the authenticated
        user is a member of (any role), with the same search, filters, ordering and
        pagination as the per-project list. A search for an issue key such as `API-12`
        matches that issue in its own project. Use `project` to narrow to one project
        and `assignee=me` for "my issues".
      parameters:
      - in: query
        name: assignee
        schema:
          type: string
        description: 'Only issues assigned to this user: a user id (a positive integer),
          `me` for the requester, or `unassigned` for issues with no assignee. An
          invalid value returns 400 with code `bad_request`.'
      - in: query
        name: due_after
        schema:
          type: string
          format: date
        description: Only issues due on or after this date (YYYY-MM-DD). Issues without
          a due date are excluded. It cannot be later than `due_before`. An invalid
          value returns 400 with code `bad_request`.
      - in: query
        name: due_before
        schema:
          type: string
          format: date
        description: Only issues due on or before this date (YYYY-MM-DD). Issues without
          a due date are excluded. An invalid value returns 400 with code `bad_request`.
      - in: query
        name: issue_type
        schema:
          type: string
          enum:
          - BUG
          - EPIC
          - STORY
          - TASK
        description: Only issues of this type. An invalid value returns 400 with code
          `bad_request`.
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created_at
          - -due_date
          - -issue_number
          - -priority
          - -title
          - -updated_at
          - created_at
          - due_date
          - issue_number
          - priority
          - title
          - updated_at
        description: Sort field; prefix with `-` for descending. A single field only.
          Priority sorts by urgency, title ignores case, and issues without a due
          date always come last. Ties are broken by id. Defaults to newest first (`-created_at`).
          An invalid value returns 400 with code `bad_request`.
      - in: query
        name: page
        schema:
          type: integer
        description: Page number, starting at 1.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Results per page (default 20, capped at 100).
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - HIGH
          - LOW
          - MEDIUM
          - URGENT
        description: Only issues with this priority. An invalid value returns 400
          with code `bad_request`.
      - in: query
        name: project
        schema:
          type: integer
        description: Only issues of the project with this id (a positive integer).
          A project the requester is not a member of simply matches nothing. An invalid
          value returns 400 with code `bad_request`.
      - in: query
        name: search
        schema:
          type: string
        description: Case-insensitive text search over the issue title and description,
          and over the issue key (an exact key such as `API-12`). Up to 100 characters;
          an empty value means no search. Combined with the other filters using AND.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - DONE
          - IN_PROGRESS
          - IN_REVIEW
          - TODO
        description: Only issues with this status. An invalid value returns 400 with
          code `bad_request`.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIssue'
          description: ''
  /api/v1/issues/{issue_id}/:
    get:
      operationId: v1_issues_retrieve
      parameters:
      - in: path
        name: issue_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
    patch:
      operationId: v1_issues_partial_update
      parameters:
      - in: path
        name: issue_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedIssue'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedIssue'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedIssue'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
  /api/v1/issues/{issue_id}/activity/:
    get:
      operationId: issue_activity_list
      description: |-
        Read-only history of one issue. Access follows the parent project's
        membership, so non-members get the same 404 as for a missing issue.
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - ISSUE_ARCHIVED
          - ISSUE_ASSIGNED
          - ISSUE_CREATED
          - ISSUE_STATUS_CHANGED
          - ISSUE_UNASSIGNED
          - ISSUE_UPDATED
          - MEMBER_ADDED
          - MEMBER_REMOVED
          - PROJECT_ARCHIVED
          - PROJECT_CREATED
          - PROJECT_UPDATED
          - ROLE_CHANGED
      - in: path
        name: issue_id
        schema:
          type: integer
        required: true
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: user
        schema:
          type: integer
        description: Id of the user who performed the action.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivity'
          description: ''
  /api/v1/issues/{issue_id}/archive/:
    post:
      operationId: v1_issues_archive_create
      parameters:
      - in: path
        name: issue_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
  /api/v1/issues/{issue_id}/comments/:
    get:
      operationId: issue_comment_list
      parameters:
      - in: path
        name: issue_id
        schema:
          type: integer
        required: true
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedComment'
          description: ''
    post:
      operationId: issue_comment_create
      parameters:
      - in: path
        name: issue_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommentInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommentInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
  /api/v1/issues/{issue_id}/comments/{comment_id}/:
    get:
      operationId: issue_comment_retrieve
      parameters:
      - in: path
        name: comment_id
        schema:
          type: integer
        required: true
      - in: path
        name: issue_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
    patch:
      operationId: issue_comment_partial_update
      parameters:
      - in: path
        name: comment_id
        schema:
          type: integer
        required: true
      - in: path
        name: issue_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCommentInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCommentInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCommentInput'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
    delete:
      operationId: issue_comment_delete
      parameters:
      - in: path
        name: comment_id
        schema:
          type: integer
        required: true
      - in: path
        name: issue_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/issues/{issue_id}/transition/:
    post:
      operationId: v1_issues_transition_create
      parameters:
      - in: path
        name: issue_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTransition'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IssueTransition'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IssueTransition'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
  /api/v1/projects/:
    get:
      operationId: projects_list
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Page number, starting at 1.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Results per page (default 20, capped at 100).
      - in: query
        name: search
        schema:
          type: string
        description: Case-insensitive text search over the project name and key (partial
          matches allowed). Only projects you are a member of are searched. Up to
          100 characters; an empty value means no search. An invalid value returns
          400 with code `bad_request`.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProject'
          description: ''
    post:
      operationId: v1_projects_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/v1/projects/{project_id}/:
    get:
      operationId: project_retrieve
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    patch:
      operationId: v1_projects_partial_update
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProject'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProject'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProject'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/v1/projects/{project_id}/activity/:
    get:
      operationId: project_activity_list
      description: |-
        Read-only history of a project. Any current member may read it,
        including viewers, members who joined later, and archived projects.
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - ISSUE_ARCHIVED
          - ISSUE_ASSIGNED
          - ISSUE_CREATED
          - ISSUE_STATUS_CHANGED
          - ISSUE_UNASSIGNED
          - ISSUE_UPDATED
          - MEMBER_ADDED
          - MEMBER_REMOVED
          - PROJECT_ARCHIVED
          - PROJECT_CREATED
          - PROJECT_UPDATED
          - ROLE_CHANGED
      - in: query
        name: entity_id
        schema:
          type: integer
        description: Requires entity_type.
      - in: query
        name: entity_type
        schema:
          type: string
          enum:
          - ISSUE
          - MEMBERSHIP
          - PROJECT
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      - in: query
        name: user
        schema:
          type: integer
        description: Id of the user who performed the action.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivity'
          description: ''
  /api/v1/projects/{project_id}/archive/:
    post:
      operationId: v1_projects_archive_create
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/projects/{project_id}/issues/:
    get:
      operationId: v1_projects_issues_retrieve
      parameters:
      - in: query
        name: assignee
        schema:
          type: string
        description: 'Only issues assigned to this user: a user id (a positive integer),
          `me` for the requester, or `unassigned` for issues with no assignee. An
          invalid value returns 400 with code `bad_request`.'
      - in: query
        name: due_after
        schema:
          type: string
          format: date
        description: Only issues due on or after this date (YYYY-MM-DD). Issues without
          a due date are excluded. It cannot be later than `due_before`. An invalid
          value returns 400 with code `bad_request`.
      - in: query
        name: due_before
        schema:
          type: string
          format: date
        description: Only issues due on or before this date (YYYY-MM-DD). Issues without
          a due date are excluded. An invalid value returns 400 with code `bad_request`.
      - in: query
        name: issue_type
        schema:
          type: string
          enum:
          - BUG
          - EPIC
          - STORY
          - TASK
        description: Only issues of this type. An invalid value returns 400 with code
          `bad_request`.
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created_at
          - -due_date
          - -issue_number
          - -priority
          - -title
          - -updated_at
          - created_at
          - due_date
          - issue_number
          - priority
          - title
          - updated_at
        description: Sort field; prefix with `-` for descending. A single field only.
          Priority sorts by urgency, title ignores case, and issues without a due
          date always come last. Ties are broken by id. Defaults to newest first (`-created_at`).
          An invalid value returns 400 with code `bad_request`.
      - in: query
        name: page
        schema:
          type: integer
        description: Page number, starting at 1.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Results per page (default 20, capped at 100).
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - HIGH
          - LOW
          - MEDIUM
          - URGENT
        description: Only issues with this priority. An invalid value returns 400
          with code `bad_request`.
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      - in: query
        name: search
        schema:
          type: string
        description: Case-insensitive text search over the issue title and description,
          and over the issue key (an exact key such as `API-12`). Up to 100 characters;
          an empty value means no search. Combined with the other filters using AND.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - DONE
          - IN_PROGRESS
          - IN_REVIEW
          - TODO
        description: Only issues with this status. An invalid value returns 400 with
          code `bad_request`.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIssue'
          description: ''
    post:
      operationId: v1_projects_issues_create
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Issue'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Issue'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Issue'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
  /api/v1/projects/{project_id}/members/:
    get:
      operationId: v1_projects_members_list
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
